<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>设计核验对照</title>
    <style>
      body { margin: 0; padding: 24px; background: #181512; color: #f8f0df; font-family: sans-serif; }
      h1 { font-size: 18px; }
      main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
      figure { margin: 0; }
      figcaption { margin: 0 0 8px; font-size: 14px; color: #d9b87a; }
      img { display: block; width: 100%; border-radius: 12px; }
    </style>
  </head>
  <body>
    <h1>设计核验：选定方向与实现截图</h1>
    <main>
      <figure><figcaption>选定方向</figcaption><img src="/qa-选定方向.png" alt="选定方向" /></figure>
      <figure><figcaption>实现：视频儿童端的观察热点环节</figcaption><img src="/qa-儿童端观察桌面.png" alt="实现截图" /></figure>
    </main>
  </body>
</html>
